name: CI

on:
  push:
    branches: ["product"]
  pull_request:
    branches: ["product"]
  workflow_dispatch:

jobs:
  build:
    name: Build (net6 / net8 / net9 / net10)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Print installed SDKs
        run: dotnet --list-sdks

      - name: Restore
        run: dotnet restore ObsidianScanner/ObsidianScanner.csproj

      - name: Build all target frameworks
        run: dotnet build ObsidianScanner/ObsidianScanner.csproj -c Release --no-restore
