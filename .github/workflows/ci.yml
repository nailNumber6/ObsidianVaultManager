name: CI

on:
  push:
    branches: ["product"]
  pull_request:
    branches: ["product"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: ${{ matrix.tfm }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net6.0
            sdk: 6.0.x
          - tfm: net8.0
            sdk: 8.0.x
          - tfm: net9.0
            sdk: 9.0.x
          - tfm: net10.0
            sdk: 10.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.sdk }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
          cache: true
          cache-dependency-path: ObsidianScanner/ObsidianScanner.csproj

      - name: Build ${{ matrix.tfm }}
        run: >
          dotnet build ObsidianScanner/ObsidianScanner.csproj
          -c Release
          -f ${{ matrix.tfm }}
          -nologo
          -v:minimal
